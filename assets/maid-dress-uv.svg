      <path d="M391 291Q395 315 417 343M406 290Q415 321 435 334M597 292Q588 316 566 336M615 301Q609 330 590 356" stroke="#fffaf1" stroke-width="3.2"/>
      <use xlink:href="#apron" transform="translate(500 410) scale(.93 .94) translate(-500 -410)" stroke="#ccada4" stroke-width="1.5"/>
      <use xlink:href="#apron" transform="translate(500 410) scale(.916 .93) translate(-500 -410)" stroke="#fff9ef" stroke-width="2"/>
      <use xlink:href="#apron" transform="translate(500 410) scale(.90 .913) translate(-500 -410)" stroke="#c4ac9b" stroke-width="1.25" stroke-dasharray="1.7 3.8"/>
    </g>
    <!-- Compensate for the skirt's circumferential UV scale, so that a
         front view of the applied stitch retains the icon's proportions. -->
    <use xlink:href="#deepseek-icon" transform="translate(453 402) scale(1.65 2.71)"/>
  </g>
  <!-- A continuous ivory waistband crosses the bodice-to-skirt join. -->
  <path d="M0 264Q128 267 256 264T512 264T768 264T1024 264V290Q896 293 768 290T512 290T256 290T0 290Z" fill="url(#ivory)" stroke="#b8a6ab" stroke-width="1.45"/>
  <path d="M0 268Q128 271 256 268T512 268T768 268T1024 268M0 286Q128 289 256 286T512 286T768 286T1024 286" fill="none" stroke="#fffbf2" stroke-width="1.2"/>
  <path d="M0 287.5Q128 290.5 256 287.5T512 287.5T768 287.5T1024 287.5" fill="none" stroke="#b7a5a1" stroke-width=".7" stroke-dasharray="1.1 2.4"/>
