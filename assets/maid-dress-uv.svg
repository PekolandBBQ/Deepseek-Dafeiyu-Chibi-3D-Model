        <use xlink:href="#trim-line" stroke="#ebc997" stroke-width="1.3" transform="translate(0 -4.5)"/>
        <use xlink:href="#trim-line" stroke="#ad9996" stroke-width="1.8" transform="translate(0 43)"/>
        <use xlink:href="#trim-line" stroke="#fff6e6" stroke-width=".85" transform="translate(0 42.3)"/>
        <use xlink:href="#trim-line" stroke="#bc9f91" stroke-width="1.1" stroke-dasharray="1 3" transform="translate(0 47)"/>
      </g>
      <g fill="#c4b0ad" stroke="#eee3d9" stroke-width=".6">
        <path d="M16 49q-4-7-1-9q3 3 1 9m2 0q0-6 4-7q1 4-4 7m-4 .2q-5-2-5-6q4 1 5 6Z"/>
        <path d="M48 58q-4-7-1-9q3 3 1 9m2 0q0-6 4-7q1 4-4 7m-4 .2q-5-2-5-6q4 1 5 6Z"/>
      </g>
    </pattern>
    <path id="shell" d="M0 6C-2 6-3 5-4 3C-8 1-11-3-10-6Q-9-8-7-7Q-7-11-4-10Q-3-14 0-12Q3-14 4-10Q7-12 8-8Q12-9 11-5C11-1 6 2 3 4Q2 6 0 6Z"/>
