  </defs>
  <rect width="1024" height="768" fill="url(#silk)"/>
  <rect width="1024" height="768" fill="url(#pleats)"/>
  <!-- Navy dress, embroidered shell/seaweed border and two rows of hem stitching. -->
  <rect y="643" width="1024" height="47" fill="url(#sea-border)"/>
  <rect y="683" width="1024" height="85" fill="url(#petticoat)"/>
  <g stroke="#caa87c" stroke-width="1" fill="none">
    <path d="M0 639 Q16 634 32 639 T64 639 T96 639 T128 639 T160 639 T192 639 T224 639 T256 639 T288 639 T320 639 T352 639 T384 639 T416 639 T448 639 T480 639 T512 639 T544 639 T576 639 T608 639 T640 639 T672 639 T704 639 T736 639 T768 639 T800 639 T832 639 T864 639 T896 639 T928 639 T960 639 T992 639 T1024 639" stroke-dasharray="1.3 3.3" opacity=".73"/>
  </g>
  <!-- Bodice under the two separate shoulder tapes. Real pearl brooch sits
       on the knot at v = .106; the tails and shirt are sewn behind it. -->
  <use xlink:href="#shirt" fill="url(#ivory)"/>
  <g clip-path="url(#shirt-clip)" fill="none" stroke-linecap="round">
    <path d="M432 -5Q450 68 464 171M452 -5Q469 87 477 176M486 0L490 176M574 -5Q555 91 546 177M595 -5Q572 87 557 176" stroke="#cfbfc1" stroke-width="2.8"/>
    <path d="M435 -5Q453 68 467 171M455 -5Q472 87 480 176M489 0L493 176M577 -5Q558 91 549 177M598 -5Q575 87 560 176" stroke="#fffaf0" stroke-width="1.75"/>
    <path d="M502 -5Q501 63 504 175M520 -5Q523 75 519 175" stroke="#b9a8af" stroke-width="1.1"/>
  </g>
  <path d="M422 164Q512 177 602 164L594 273H431Z" fill="#313451"/>
  <path d="M423 166Q512 179 601 166M433 259Q511 267 592 259" fill="none" stroke="#6d6680" stroke-width="1.3"/>
  <path d="M435 171Q513 182 590 170" stroke="#baa58e" stroke-width=".9" stroke-dasharray="1.2 2.7" fill="none"/>
  <g><use xlink:href="#pearl" x="476" y="191"/><use xlink:href="#pearl" x="544" y="191"/><use xlink:href="#pearl" x="476" y="230"/><use xlink:href="#pearl" x="544" y="230"/><use xlink:href="#pearl" x="511" y="147"/></g>
  <g transform="translate(512 10) scale(.97 .76)">
