      <use xlink:href="#sea-shell" transform="translate(64 17) scale(.79 1)"/>
      <g fill="#e4c598"><use xlink:href="#spark" transform="translate(4 9)"/><use xlink:href="#spark" transform="translate(101 25) scale(.67)"/>
        <circle cx="8" cy="5.3" r=".85"/><circle cx="37" cy="17" r="1.3"/><circle cx="80" cy="4.4" r=".95"/><circle cx="109" cy="14" r=".8"/></g>
      <path d="M0 32 Q32 24 64 32 T128 32" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
      <path d="M0 35 Q32 27 64 35 T128 35" fill="none" stroke="#918075" stroke-width=".75" stroke-dasharray="1.2 2.1"/>
    </pattern>
