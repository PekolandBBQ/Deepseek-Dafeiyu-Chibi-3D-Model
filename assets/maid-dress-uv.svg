      <path d="M0 0 Q12 42 4 90 H0Z" fill="#bfadb5" opacity=".27"/>
      <path d="M10 0 Q24 35 19 90" fill="none" stroke="#fffaf1" stroke-width="2" opacity=".54"/>
    </pattern>
    <path id="trim-line" d="M0 11 Q16 0 32 11 T64 11"/>
