      <path d="M16 15Q13 11 11 11Q10 7 12 6Q17 7 16 15ZM27 9Q26 4 29 2Q32 3 32 5Q32 8 27 9ZM39 11Q42 5 46 5Q46 10 39 11ZM77 16Q76 10 72 9Q70 13 77 16ZM99 12Q100 6 104 5Q107 9 99 12ZM115 20Q121 15 123 16Q124 19 115 20Z" stroke-width=".9"/>
      <path d="M49 18Q41 21 45 24Q48 25 51 21M87 12Q86 7 89 5" stroke-width=".9"/>
    </g>
    <pattern id="sea-border" width="128" height="49" patternUnits="userSpaceOnUse" y="643">
