<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="4096" height="3072" viewBox="0 0 1024 768">
  <title>蓝鲸女仆 · 连衣裙与刺绣围裙的 UV 母版</title>
  <desc>正中为前身，左右边缘为后中缝。围裙边界与独立镂空花边的缝线对应。</desc>
  <defs>
    <linearGradient id="silk" x2=".18" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#292c4c"/><stop offset=".32" stop-color="#252843"/>
      <stop offset=".58" stop-color="#34375c"/><stop offset=".87" stop-color="#37395f"/>
      <stop offset="1" stop-color="#262943"/>
    </linearGradient>
    <linearGradient id="ivory" x2=".65" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff6eb"/><stop offset=".28" stop-color="#f2e4df"/>
      <stop offset=".57" stop-color="#fff4e9"/><stop offset=".86" stop-color="#edddd9"/>
      <stop offset="1" stop-color="#e1cfc8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2=".72" y2="0">
      <stop stop-color="#242641"/><stop offset=".38" stop-color="#393956"/>
      <stop offset=".59" stop-color="#515579"/><stop offset=".8" stop-color="#343852"/><stop offset="1" stop-color="#252a46"/>
    </linearGradient>
    <linearGradient id="gold" x2=".28" y2="1">
      <stop stop-color="#b28965"/><stop offset=".27" stop-color="#edd4a2"/>
      <stop offset=".50" stop-color="#f4dfb4"/><stop offset=".73" stop-color="#c99c70"/>
      <stop offset="1" stop-color="#dcb98d"/>
    </linearGradient>
    <radialGradient id="button" cx=".31" cy=".22" r=".92">
      <stop stop-color="#ffefc3"/><stop offset=".36" stop-color="#dbc69f"/>
      <stop offset=".78" stop-color="#ac8c6d"/><stop offset="1" stop-color="#6b5c62"/>
    </radialGradient>
    <!-- Two widths of navy satin, aligned with the sixteen modeled pleats. -->
    <linearGradient id="pleat" x2="1" y2=".04">
      <stop stop-color="#14182c" stop-opacity=".28"/><stop offset=".22" stop-color="#161a32" stop-opacity=".05"/>
      <stop offset=".56" stop-color="#9ca2c5" stop-opacity=".10"/><stop offset=".78" stop-color="#8690b6" stop-opacity=".03"/>
      <stop offset="1" stop-color="#14182c" stop-opacity=".28"/>
    </linearGradient>
    <pattern id="pleats" width="64" height="768" patternUnits="userSpaceOnUse">
      <rect width="64" height="768" fill="url(#pleat)"/>
    </pattern>
    <pattern id="cotton-ribs" width="32" height="90" patternUnits="userSpaceOnUse">
